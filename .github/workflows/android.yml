name: Android APK
on:
  push:
    branches: [main]
    paths: ['app/*.js', 'app/*.html', 'app/*.css', 'app/vendor/**', 'resources/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Εξαρτήσεις
        run: npm install
      - name: Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#2f5bd3' --splashBackgroundColor '#f6f5f1' || echo "assets skipped"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: Σταθερό κλειδί υπογραφής (για να γίνεται ενημέρωση χωρίς απεγκατάσταση)
        run: |
          mkdir -p ~/.android
          base64 -d android-signing/debug.keystore.b64 > ~/.android/debug.keystore
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../protypa.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Εφαρμογή Android 1.${{ github.run_number }}
          body: 'Κατέβασε το protypa.apk στο κινητό και άνοιξέ το για εγκατάσταση/ενημέρωση. Η πρόοδος δεν χάνεται.'
          files: protypa.apk
          make_latest: true
